name: 💰 Earning Report · Zedge 1 (hourly)
run-name: 💰 Earning report · Zedge 1

# Standalone hourly earning collector for Zedge 1.
# Logs in, runs the MH-EARNINGS collector (same logic as the upload bot),
# pushes to this account's Firebase (dashboardSettings/earnings) and notifies Telegram.
# VPN: profile comes from the panel/app -> Firebase dashboardSettings/vpn, exactly
# like the upload bot (mode "none" = direct/proxy as before).
#
# Setup: copy this file to .github/workflows/ in the Zedge 1 repo (default branch).
#   - hourly run: schedule below (cron "19 * * * *", GitHub may delay a few minutes)
#   - manual run: Actions tab -> run workflow (optional VPN profile override)
# Required secrets (same names as the upload workflow):
#   ZEDGE1_DB_URL, ZEDGE1_EMAIL, ZEDGE1_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      vpn_profile:
        description: "🔐 VPN profile id (blank = active profile from Firebase dashboardSettings/vpn)"
        required: false
        default: ""
      proxy_server:
        description: "HTTP proxy host:port (blank = none; ignored when VPN is active unless keepProxy is on)"
        required: false
        default: ""
      proxy_user:
        description: "Proxy username"
        required: false
        default: ""
      proxy_pass:
        description: "Proxy password"
        required: false
        default: ""
      zedge_email:
        description: "Zedge email (blank = GitHub secret)"
        required: false
        default: ""
      zedge_password:
        description: "Zedge password (blank = GitHub secret)"
        required: false
        default: ""
      headless:
        description: "Run headless? true/false"
        required: false
        default: "true"

concurrency:
  group: earning-zedge1
  cancel-in-progress: false

jobs:
  earning:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        shell: pwsh
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: 🔐 Create vpn.mjs (OpenVPN / WireGuard helper)
        shell: pwsh
        run: |
          @'
          // ============================================================================
          //  vpn.mjs  -  OpenVPN / WireGuard tunnel helper for the Zedge automation runner
          //  v24 - profiles live in Firebase RTDB at  dashboardSettings/vpn  (per account)
          //
          //    node vpn.mjs connect     -> main automation: bring the tunnel up (or skip when disabled)
          //    node vpn.mjs test        -> panel/app "Test VPN": connect, verify, report, disconnect
          //    node vpn.mjs disconnect  -> tear the tunnel down (idempotent)
          //
          //  Firebase layout (per account database):
          //    dashboardSettings/vpn/mode              "none" | "openvpn" | "wireguard"   ("none" = proxy / direct as before)
          //    dashboardSettings/vpn/activeProfileId   id of the profile used by real runs
          //    dashboardSettings/vpn/keepProxy         true -> HTTP proxy inputs stay active inside the tunnel
          //    dashboardSettings/vpn/profiles/<id>     { name, type, config, username, password, ca, cert, key, tlsAuth, tlsCrypt, extra }
          //    dashboardSettings/vpn/lastTest          result written by "test"
          //    dashboardSettings/vpn/lastRun           result written by "connect"
          // ============================================================================
          import fs from "fs";
          import os from "os";
          import path from "path";
          import { spawn, spawnSync } from "child_process";

          const MODE = (process.argv[2] || "connect").toLowerCase();
          const DB = (process.env.FIREBASE_DB_URL || "").replace(/\/+$/, "");
          const ACCOUNT = process.env.ACCOUNT_LABEL || "ZEDGE";

          const PROFILE_OVERRIDE = (process.env.VPN_PROFILE || "").trim();
          const VPN_PATH = "dashboardSettings/vpn";
          const IS_WIN = process.platform === "win32";
          const WORK = path.join(process.env.RUNNER_TEMP || os.tmpdir(), "zedge-vpn");
          const STATE_FILE = path.join(WORK, "state.json");
          const RUN_ID = process.env.GITHUB_RUN_ID || "";
          const RUN_URL = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY && RUN_ID
            ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${RUN_ID}` : "";
          const OVPN_DIR = "C:\\Program Files\\OpenVPN";
          const WG_DIR = "C:\\Program Files\\WireGuard";
          const WG_TUNNEL = "zedgewg";
          const LOG_LINES = [];

          fs.mkdirSync(WORK, { recursive: true });

          // ---------------------------------------------------------------- utilities
          const ts = () => new Date().toISOString().slice(11, 19);
          function log(msg) { const line = `[${ts()}] ${msg}`; console.log(line); LOG_LINES.push(line); if (LOG_LINES.length > 400) LOG_LINES.shift(); }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const mask = (s) => (s ? String(s).slice(0, 2) + "***" : "");

          function setEnv(k, v) { try { if (process.env.GITHUB_ENV) fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`); } catch (_) {} }
          function setOutput(k, v) { try { if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`); } catch (_) {} }
          function summary(md) { try { if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n"); } catch (_) {} }

          async function fetchTimeout(url, opts = {}, ms = 15000) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, { ...opts, signal: ctrl.signal }); } finally { clearTimeout(t); }
          }
          async function jget(p) {
            if (!DB) throw new Error("FIREBASE_DB_URL is not set");
            const r = await fetchTimeout(`${DB}/${p}.json`, {}, 20000);
            if (!r.ok) throw new Error(`Firebase GET ${p} -> HTTP ${r.status}`);
            return r.json();
          }
          async function jpatch(p, body) {
            try {
              const r = await fetchTimeout(`${DB}/${p}.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }, 20000);
              if (!r.ok) log(`⚠️ Firebase PATCH ${p} -> HTTP ${r.status}`);
            } catch (e) { log(`⚠️ Firebase PATCH ${p} failed: ${e.message}`); }
          }

          function run(cmd, args, opts = {}) {
            const r = spawnSync(cmd, args, { encoding: "utf8", windowsHide: true, timeout: opts.timeout || 10 * 60 * 1000, ...opts });
            return { code: r.status, out: (r.stdout || "") + (r.stderr || ""), error: r.error };
          }
          function ps(script, timeout) { return run("powershell", ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", script], { timeout }); }
          function sh(cmd, timeout) { return run("bash", ["-lc", cmd], { timeout }); }
          function tail(file, n = 40) { try { return fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean).slice(-n).join("\n"); } catch (_) { return ""; } }
          function readState() { try { return JSON.parse(fs.readFileSync(STATE_FILE, "utf8")); } catch (_) { return null; } }
          function writeState(s) { fs.writeFileSync(STATE_FILE, JSON.stringify(s)); }

          // ------------------------------------------------------------ public IP probe
          async function publicIp() {
            const probes = [
              { url: "https://ipinfo.io/json", map: (j) => ({ ip: j.ip, country: j.country, city: j.city, region: j.region, org: j.org, timezone: j.timezone }) },
              { url: "https://ipapi.co/json/", map: (j) => ({ ip: j.ip, country: j.country_code, city: j.city, region: j.region, org: j.org, timezone: j.timezone }) },
              { url: "https://api.ipify.org?format=json", map: (j) => ({ ip: j.ip }) },
            ];
            let lastErr = "";
            for (const p of probes) {
              try {
                const r = await fetchTimeout(p.url, { headers: { "User-Agent": "curl/8.0" } }, 15000);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                const info = p.map(j);
                if (info && info.ip) return info;
              } catch (e) { lastErr = `${p.url}: ${e.message}`; }
            }
            throw new Error(`public IP lookup failed (${lastErr})`);
          }
          async function zedgeCheck() {
            try {
              const r = await fetchTimeout("https://www.zedge.net/", { method: "GET", redirect: "follow", headers: { "User-Agent": "Mozilla/5.0" } }, 25000);
              return { ok: r.status < 500, status: r.status };
            } catch (e) { return { ok: false, status: 0, error: e.message }; }
          }
          function fmtIp(i) { return i ? `${i.ip}${i.country ? ` (${[i.city, i.region, i.country].filter(Boolean).join(", ")})` : ""}${i.org ? ` · ${i.org}` : ""}` : "-"; }

          // ------------------------------------------------------------- profile load
          async function loadProfile() {
            const data = (await jget(VPN_PATH)) || {};
            const profiles = data.profiles || {};
            const wantId = PROFILE_OVERRIDE || data.activeProfileId || "";
            if (!PROFILE_OVERRIDE) {
              const mode = String(data.mode || "none").toLowerCase();
              if (mode === "none" || mode === "proxy" || !wantId) return { disabled: true, reason: !wantId ? "no active profile" : `mode = ${mode}`, data };
            }
            const profile = profiles[wantId];
            if (!profile) throw new Error(`VPN profile "${wantId}" not found under ${VPN_PATH}/profiles (save it from the panel / app first)`);
            const type = String(profile.type || "").toLowerCase() === "wireguard" ? "wireguard" : "openvpn";
            return { disabled: false, id: wantId, type, profile: { ...profile, type }, data };
          }

          // ------------------------------------------------------------ OpenVPN files
          /** Builds a self-contained .ovpn: inlines uploaded certificates, wires auth-user-pass, adds runner safety routes. */
          function buildOvpn(profile, dir) {
            let cfg = String(profile.config || "").replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "");
            if (!cfg.trim()) throw new Error("OpenVPN profile has an empty .ovpn config");
            if (!/^\s*(remote|remote-random|<connection>)/m.test(cfg)) throw new Error(".ovpn has no 'remote' line - is this really an OpenVPN client config?");
            const hasBlock = (tag) => new RegExp(`<${tag}>[\\s\\S]*?</${tag}>`, "i").test(cfg);
            const dropDirective = (name) => { cfg = cfg.replace(new RegExp(`^[ \\t]*${name}[ \\t]+[^\\n]*\\n?`, "gmi"), ""); };
            const notes = [];

            // ---- certificates / keys uploaded separately -> inline blocks ----
            const inlines = [["ca", "ca"], ["cert", "cert"], ["key", "key"], ["tlsAuth", "tls-auth"], ["tlsCrypt", "tls-crypt"]];
            for (const [field, tag] of inlines) {
              const body = String(profile[field] || "").replace(/\r\n?/g, "\n").trim();
              if (!body) continue;
              if (tag === "tls-auth") {
                const m = cfg.match(/^[ \t]*tls-auth[ \t]+\S+[ \t]+([01])/mi);
                if (m && !/^\s*key-direction/m.test(cfg)) cfg += `\nkey-direction ${m[1]}\n`;
              }
              cfg = cfg.replace(new RegExp(`<${tag}>[\\s\\S]*?</${tag}>\\n?`, "gi"), "");
              dropDirective(tag);
              cfg += `\n<${tag}>\n${body}\n</${tag}>\n`;
              notes.push(`${tag} inlined from upload`);
            }

            // ---- external file references that we cannot satisfy ----
            const fileDirectives = ["ca", "cert", "key", "tls-auth", "tls-crypt", "tls-crypt-v2", "pkcs12", "dh", "crl-verify", "extra-certs", "secret"];
            const missing = [];
            for (const d of fileDirectives) {
              const re = new RegExp(`^[ \\t]*${d}[ \\t]+([^\\s#]+)`, "gmi");
              let m;
              while ((m = re.exec(cfg))) {
                const f = m[1].replace(/^['"]|['"]$/g, "");
                if (f === "[inline]") continue;
                if (hasBlock(d)) { dropDirective(d); continue; }
                missing.push(`${d} ${f}`);
              }
            }
            if (missing.length) throw new Error(`.ovpn references external file(s) that were not uploaded: ${missing.join(", ")}. Add them in the VPN card (CA / Cert / Key / TLS fields) or paste an inline (.ovpn with <ca>...</ca>) config.`);

            // ---- username / password ----
            const user = String(profile.username || "").trim();
            const pass = String(profile.password || "");
            const wantsAuth = /^[ \t]*auth-user-pass\b/m.test(cfg);
            if (wantsAuth && !user) throw new Error("This .ovpn requires a username/password (auth-user-pass) but none is saved in the profile.");
            if (user) {
              dropDirective("auth-user-pass");
              cfg = cfg.replace(/^[ \t]*auth-user-pass[ \t]*$/gmi, "");
              fs.writeFileSync(path.join(dir, "auth.txt"), `${user}\n${pass}\n`, { mode: 0o600 });
              cfg += `\nauth-user-pass auth.txt\nauth-nocache\n`;
              notes.push(`credentials: ${mask(user)}`);
            } else notes.push("certificate-only login (no username/password)");

            // ---- interactive / unsafe directives ----
            for (const d of ["askpass", "management", "management-query-passwords", "daemon", "log", "log-append", "status", "writepid", "up", "down", "route-up", "ipchange", "client-connect", "user", "group", "chroot"]) dropDirective(d);
            cfg = cfg.replace(/^[ \t]*(daemon|management-query-passwords|auth-retry[ \t]+interact)[ \t]*$/gmi, "");

            // ---- runner safety: keep the cloud DNS/metadata reachable, tunnel DNS, no prompts ----
            const extra = ["", "# --- added by zedge automation (v24) ---", "auth-retry none", "connect-retry 3 10", "connect-timeout 25", "resolv-retry 30", "server-poll-timeout 25", "verb 3", "mute-replay-warnings", "suppress-timestamps"];
            if (!/^\s*explicit-exit-notify/m.test(cfg) && /^\s*proto\s+udp/mi.test(cfg)) extra.push("explicit-exit-notify 1");
            if (IS_WIN) extra.push("route 168.63.129.16 255.255.255.255 net_gateway");    // Azure DNS / metadata stays on the LAN
            if (!/^\s*dhcp-option\s+DNS/mi.test(cfg)) extra.push("dhcp-option DNS 1.1.1.1", "dhcp-option DNS 8.8.8.8");
            if (String(profile.extra || "").trim()) extra.push("# --- profile extra lines ---", String(profile.extra).replace(/\r\n?/g, "\n").trim());
            if (!/^\s*redirect-gateway/m.test(cfg)) notes.push("no redirect-gateway in config (server should push it - IP change is verified after connect)");
            cfg = cfg.trimEnd() + "\n" + extra.join("\n") + "\n";
            fs.writeFileSync(path.join(dir, "zedge.ovpn"), cfg, { mode: 0o600 });
            return notes;
          }

          // ------------------------------------------------------------- WireGuard
          function buildWg(profile, dir) {
            let cfg = String(profile.config || "").replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "").trim();
            if (!cfg) throw new Error("WireGuard profile has an empty config");
            if (!/^\s*\[Interface\]/mi.test(cfg) || !/^\s*\[Peer\]/mi.test(cfg)) throw new Error("WireGuard config needs both [Interface] and [Peer] sections");
            if (!/^\s*PrivateKey\s*=/mi.test(cfg)) throw new Error("WireGuard config is missing PrivateKey");
            if (!/^\s*Endpoint\s*=/mi.test(cfg)) throw new Error("WireGuard config is missing Endpoint");
            const notes = [];
            if (!/^\s*DNS\s*=/mi.test(cfg)) { cfg = cfg.replace(/^\s*\[Interface\]\s*$/mi, "[Interface]\nDNS = 1.1.1.1, 8.8.8.8"); notes.push("DNS 1.1.1.1 added"); }
            if (!/AllowedIPs\s*=.*0\.0\.0\.0\/0/i.test(cfg)) notes.push("AllowedIPs does not cover 0.0.0.0/0 - only part of the traffic will use the tunnel");
            if (String(profile.extra || "").trim()) cfg += "\n" + String(profile.extra).replace(/\r\n?/g, "\n").trim();
            fs.writeFileSync(path.join(dir, `${WG_TUNNEL}.conf`), cfg + "\n", { mode: 0o600 });
            return notes;
          }

          // ----------------------------------------------------------- installers
          function ensureOpenVpn() {
            if (IS_WIN) {
              const exe = path.join(OVPN_DIR, "bin", "openvpn.exe");
              if (fs.existsSync(exe)) return exe;
              log("📦 Installing OpenVPN (chocolatey)...");
              const r = ps("choco install openvpn -y --no-progress --limit-output | Out-Null; exit $LASTEXITCODE", 8 * 60 * 1000);
              if (!fs.existsSync(exe)) throw new Error(`OpenVPN install failed (exit ${r.code}): ${r.out.slice(-400)}`);
              return exe;
            }
            if (run("which", ["openvpn"]).code !== 0) {
              log("📦 Installing OpenVPN (apt)...");
              const r = sh("sudo apt-get update -qq && sudo apt-get install -y -qq openvpn", 6 * 60 * 1000);
              if (r.code !== 0) throw new Error(`OpenVPN install failed: ${r.out.slice(-400)}`);
            }
            return "openvpn";
          }
          function ensureWireGuard() {
            if (IS_WIN) {
              const exe = path.join(WG_DIR, "wireguard.exe");
              if (fs.existsSync(exe)) return exe;
              log("📦 Installing WireGuard (chocolatey)...");
              const r = ps("choco install wireguard -y --no-progress --limit-output | Out-Null; exit $LASTEXITCODE", 8 * 60 * 1000);
              if (!fs.existsSync(exe)) throw new Error(`WireGuard install failed (exit ${r.code}): ${r.out.slice(-400)}`);
              return exe;
            }
            if (run("which", ["wg-quick"]).code !== 0) {
              log("📦 Installing WireGuard (apt)...");
              const r = sh("sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools resolvconf", 6 * 60 * 1000);
              if (r.code !== 0) throw new Error(`WireGuard install failed: ${r.out.slice(-400)}`);
            }
            return "wg-quick";
          }

          // ------------------------------------------------------------- connect
          async function connectOpenVpn(profile) {
            const notes = buildOvpn(profile, WORK);
            notes.forEach((n) => log(`   · ${n}`));
            const exe = ensureOpenVpn();
            const logFile = path.join(WORK, "openvpn.log");
            try { fs.unlinkSync(logFile); } catch (_) {}
            let child;
            if (IS_WIN) {
              child = spawn(exe, ["--config", "zedge.ovpn", "--log", logFile], { cwd: WORK, detached: true, stdio: "ignore", windowsHide: true });
            } else {
              child = spawn("sudo", ["openvpn", "--config", "zedge.ovpn", "--log", logFile], { cwd: WORK, detached: true, stdio: "ignore" });
            }
            child.unref();
            writeState({ type: "openvpn", pid: child.pid, logFile, exe });
            log(`🚀 OpenVPN started (pid ${child.pid}), waiting for the tunnel...`);
            const deadline = Date.now() + 100 * 1000;
            while (Date.now() < deadline) {
              await sleep(2000);
              const text = (() => { try { return fs.readFileSync(logFile, "utf8"); } catch (_) { return ""; } })();
              if (/Initialization Sequence Completed/.test(text)) { log("✅ OpenVPN: Initialization Sequence Completed"); return; }
              const fatal = [
                [/AUTH_FAILED|auth-failure/i, "authentication failed - wrong username/password (or the account is expired / device limit reached)"],
                [/TLS Error: TLS key negotiation failed|TLS handshake failed/i, "TLS handshake failed - server unreachable, wrong port/proto, or CA/TLS-auth key does not match"],
                [/Cannot resolve host address|RESOLVE:/i, "cannot resolve the VPN server hostname"],
                [/Options error/i, "OpenVPN options error - the .ovpn has an unsupported / misspelled directive"],
                [/Cannot load (certificate|private key|CA)|error:0[0-9A-F]+:PEM/i, "certificate / key could not be loaded - check CA / cert / key content"],
                [/All (TAP-Windows|wintun|TAP) adapters on this system are currently in use|There are no TAP-Windows|no TAP adapters/i, "no TAP/Wintun adapter available on the runner"],
                [/Exiting due to fatal error|process exiting/i, "OpenVPN exited"],
              ];
              for (const [re, why] of fatal) if (re.test(text)) throw new Error(`OpenVPN: ${why}\n--- openvpn.log ---\n${tail(logFile, 25)}`);
              if (IS_WIN) { const alive = ps(`if (Get-Process -Id ${child.pid} -ErrorAction SilentlyContinue) { 'yes' } else { 'no' }`).out.trim(); if (alive === "no" && !text.includes("Initialization Sequence Completed")) throw new Error(`OpenVPN process exited early\n--- openvpn.log ---\n${tail(logFile, 25)}`); }
            }
            throw new Error(`OpenVPN did not finish connecting within 100 s\n--- openvpn.log ---\n${tail(logFile, 25)}`);
          }

          async function connectWireGuard(profile) {
            const notes = buildWg(profile, WORK);
            notes.forEach((n) => log(`   · ${n}`));
            const exe = ensureWireGuard();
            const conf = path.join(WORK, `${WG_TUNNEL}.conf`);
            if (IS_WIN) {
              ps(`& "${exe}" /uninstalltunnelservice ${WG_TUNNEL}`); await sleep(1500);
              const r = ps(`& "${exe}" /installtunnelservice "${conf}"; exit $LASTEXITCODE`, 60000);
              if (r.code !== 0) throw new Error(`WireGuard service install failed (exit ${r.code}): ${r.out.slice(-400)}`);
              writeState({ type: "wireguard", exe, conf });
              log("🚀 WireGuard tunnel service installed, waiting for handshake...");
              const wg = path.join(WG_DIR, "wg.exe");
              const deadline = Date.now() + 45 * 1000;
              while (Date.now() < deadline) {
                await sleep(2000);
                const s = run(wg, ["show", WG_TUNNEL]).out || "";
                if (/latest handshake/i.test(s)) { log("✅ WireGuard handshake completed"); return; }
              }
              const svc = ps(`(Get-Service -Name 'WireGuardTunnel$${WG_TUNNEL}' -ErrorAction SilentlyContinue).Status`).out.trim();
              const evt = ps(`Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='WireGuard'} -MaxEvents 12 -ErrorAction SilentlyContinue | ForEach-Object { $_.Message }`).out.trim().slice(-1200);
              throw new Error(`WireGuard: no handshake within 45 s (service ${svc || "unknown"}) - wrong keys, endpoint blocked, or UDP port unreachable.\n${evt}`);
            }
            sh(`sudo wg-quick down ${conf} 2>/dev/null; true`);
            const r = sh(`sudo cp "${conf}" /etc/wireguard/${WG_TUNNEL}.conf && sudo chmod 600 /etc/wireguard/${WG_TUNNEL}.conf && sudo wg-quick up ${WG_TUNNEL}`, 60000);
            if (r.code !== 0) throw new Error(`wg-quick up failed: ${r.out.slice(-600)}`);
            writeState({ type: "wireguard" });
            const deadline = Date.now() + 45 * 1000;
            while (Date.now() < deadline) { await sleep(2000); if (/latest handshake/i.test(sh(`sudo wg show ${WG_TUNNEL}`).out)) { log("✅ WireGuard handshake completed"); return; } }
            throw new Error("WireGuard: no handshake within 45 s");
          }

          async function disconnect(quiet = false) {
            const st = readState();
            if (!st) { if (!quiet) log("ℹ️ No VPN tunnel state - nothing to disconnect."); return; }
            try {
              if (st.type === "openvpn") {
                if (IS_WIN) { if (st.pid) ps(`Stop-Process -Id ${st.pid} -Force -ErrorAction SilentlyContinue`); ps("Get-Process openvpn -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue"); }
                else sh("sudo pkill -f 'openvpn --config zedge.ovpn' || true");
              } else if (st.type === "wireguard") {
                if (IS_WIN) ps(`& "${st.exe}" /uninstalltunnelservice ${WG_TUNNEL}`); else sh(`sudo wg-quick down ${WG_TUNNEL} || true`);
              }
              log(`🔌 VPN (${st.type}) disconnected.`);
            } catch (e) { log(`⚠️ disconnect: ${e.message}`); }
            try { fs.unlinkSync(STATE_FILE); } catch (_) {}
            try { fs.unlinkSync(path.join(WORK, "auth.txt")); } catch (_) {}
            try { fs.unlinkSync(path.join(WORK, "zedge.ovpn")); } catch (_) {}
            try { fs.unlinkSync(path.join(WORK, `${WG_TUNNEL}.conf`)); } catch (_) {}
          }

          // ------------------------------------------------------------- telegram
          async function telegram(text) {
            const tok = process.env.TELEGRAM_BOT_TOKEN, chat = process.env.TELEGRAM_CHAT_ID;
            if (!tok || !chat) return;
            try {
              await fetchTimeout("https://api.telegram.org/bot" + tok + "/sendMessage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: chat, text, parse_mode: "HTML", disable_web_page_preview: true }) }, 15000);
            } catch (_) {}
          }
          const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
          const dhakaNow = () => new Date(Date.now() + 6 * 3600 * 1000).toISOString().replace("T", " ").slice(0, 16) + " (Dhaka)";

          // ------------------------------------------------------------- main flows
